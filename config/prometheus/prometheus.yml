# =============================================================================
#  Prometheus — konfiguracja stacku szkoleniowego
#  Odpowiednik /etc/prometheus/prometheus.yml ze skryptu, rozszerzony o
#  pozostałe komponenty stacku (nazwy usług = nazwy z docker-compose.yml)
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: monitoring-lab

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

rule_files:
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus monitoruje sam siebie
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metryki systemowe hosta
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Telegraf wystawia te same metryki w formacie Prometheusa (port 9273)
  - job_name: telegraf
    static_configs:
      - targets: ["telegraf:9273"]

  # Metryki własne pozostałych komponentów stacku
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: influxdb
    static_configs:
      - targets: ["influxdb:8086"]

  # Elasticsearch nie wystawia metryk w formacie Prometheusa sam z siebie —
  # robi to za niego elasticsearch-exporter
  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]
