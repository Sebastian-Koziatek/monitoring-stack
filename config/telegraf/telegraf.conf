# =============================================================================
#  Telegraf — konfiguracja z "Instalacja InfluxDB i Telegraf.md",
#  przeniesiona do kontenera:
#   - token/org/bucket wstrzykiwane ze zmiennych środowiskowych (.env)
#   - metryki hosta czytane spod /hostfs (HOST_PROC / HOST_SYS)
#   - dodatkowy output prometheus_client (:9273) — te same dane zbiera Prometheus
# =============================================================================

[global_tags]
  environment = "szkolenie"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# InfluxDB 2.x — docelowa baza metryk
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "5s"

# Te same metryki w formacie Prometheusa (scrape job "telegraf")
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.mem]]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.net]]

[[inputs.netstat]]

[[inputs.kernel]]

# Dostępność pozostałych usług stacku — prosty "syntetyczny monitoring"
[[inputs.http_response]]
  urls = [
    "http://grafana:3000/api/health",
    "http://prometheus:9090/-/healthy",
    "http://loki:3100/ready",
    "http://influxdb:8086/health",
    "http://kibana:5601/api/status",
    "http://zabbix-web:8080/"
  ]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = true

# Metryki Elasticsearcha prosto z API (user szkoleniowy)
[[inputs.elasticsearch]]
  servers = ["http://elasticsearch:9200"]
  username = "${TRAINING_USER}"
  password = "${TRAINING_PASSWORD}"
  local = true
  cluster_health = true
  cluster_stats = true
