# =============================================================================
#  Stack monitoringowy dla szkolenia — ELK + Grafana + InfluxDB/Telegraf +
#  Loki/Promtail + Prometheus/Node Exporter + Zabbix
#
#  Kompatybilny z:  docker compose  ORAZ  podman-compose / podman compose
#  Zasady kompatybilności z Podmanem (rootless):
#    - brak klucza "version:", brak "privileged:", brak /var/run/docker.sock
#    - brak portów < 1024 (Zabbix frontend siedzi na 8081, nie na 80)
#    - brak "ulimits: memlock" (rootless nie podniesie hard limitu)
#    - bind-mounty konfiguracji z etykietą ":z" (SELinux na RHEL/Fedorze)
#    - katalogi hosta (/proc, /sys, /) montowane BEZ ":z" — nigdy ich nie relabeluj
# =============================================================================

name: monitoring-lab

networks:
  monitoring:
    driver: bridge

volumes:
  es-data:
  kibana-data:
  filebeat-data:
  grafana-data:
  influxdb-data:
  influxdb-config:
  loki-data:
  promtail-positions:
  prometheus-data:
  zabbix-db-data:
  zabbix-server-data:

services:

  # ===========================================================================
  #  ELK STACK  (odpowiednik "Instalacja ELK Stack.md")
  #  security ON, SSL OFF, single-node, user szkolenie/szkolenie
  # ===========================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=node-1
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      # Security — włączone (wymagane przez Fleet/Integrations)
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=true
      # SSL wyłączony dla uproszczenia (środowisko szkoleniowe!)
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE} -Xmx${ES_HEAP_SIZE}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Jednorazowy setup: hasło dla kibana_system + user "szkolenie" (superuser).
  # Odpowiednik kroku 7 ze skryptu (elasticsearch-reset-password + curl).
  elk-setup:
    image: curlimages/curl:8.11.1
    container_name: elk-setup
    restart: "no"
    depends_on:
      - elasticsearch
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - TRAINING_USER=${TRAINING_USER}
      - TRAINING_PASSWORD=${TRAINING_PASSWORD}
    volumes:
      - ./config/elk:/setup:ro,z
    entrypoint: ["sh", "/setup/init-users.sh"]
    networks:
      - monitoring

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - SERVER_PUBLICBASEURL=${KIBANA_PUBLIC_URL}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      # Encryption keys — bez nich Fleet/Integrations nie działają
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - I18N_LOCALE=en
    volumes:
      - kibana-data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    networks:
      - monitoring

  # Filebeat — wysyła logi hosta do Elasticsearcha (te same, które Promtail
  # wysyła do Lokiego). Bez niego ELK stoi pusty.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: filebeat
    restart: unless-stopped
    # --strict.perms=false — konfiguracja przychodzi z bind-mounta hosta
    # i nie należy do roota w kontenerze
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      - elasticsearch
    environment:
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,z
      - filebeat-data:/usr/share/filebeat/data
      - /var/log:/var/log:ro
    # Jeśli SELinux blokuje czytanie /var/log, odkomentuj (NIE dawaj tu ":z"!):
    # security_opt:
    #   - label=disable
    networks:
      - monitoring

  # Exporter metryk Elasticsearcha dla Prometheusa (ES sam ich nie wystawia)
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
    container_name: elasticsearch-exporter
    restart: unless-stopped
    depends_on:
      - elasticsearch
    command:
      - --es.uri=http://${TRAINING_USER}:${TRAINING_PASSWORD}@elasticsearch:9200
      - --es.all
      - --es.indices
      - --es.indices_settings
      - --es.cluster_settings
      - --web.listen-address=:9114
    ports:
      - "9114:9114"
    networks:
      - monitoring

  # ===========================================================================
  #  PROMETHEUS + NODE EXPORTER  (odpowiednik "Instalacja Prometheus...md")
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus:/etc/prometheus:ro,z
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --web.listen-address=:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ===========================================================================
  #  GRAFANA  (odpowiednik "Instalacja Grafany.md")
  #  Datasource'y wstrzykiwane przez provisioning — patrz config/grafana/
  # ===========================================================================

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - influxdb
      - elasticsearch
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Zmienne używane w plikach provisioningu
      - ELASTIC_USER=${TRAINING_USER}
      - ELASTIC_PASS=${TRAINING_PASSWORD}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      # Plugin do Zabbixa (wymaga internetu przy pierwszym starcie)
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro,z
    ports:
      - "3000:3000"
    networks:
      - monitoring

  # ===========================================================================
  #  LOKI + PROMTAIL  (odpowiednik "Instalacja Lokiego.md")
  # ===========================================================================

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro,z
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./config/promtail:/etc/promtail:ro,z
      - promtail-positions:/promtail
      - /var/log:/var/log:ro
    # Jeśli SELinux blokuje czytanie /var/log, odkomentuj (NIE dawaj tu ":z"!):
    # security_opt:
    #   - label=disable
    ports:
      - "9080:9080"
    networks:
      - monitoring

  # ===========================================================================
  #  INFLUXDB 2.x + TELEGRAF  (odpowiednik "Instalacja InfluxDB i Telegraf.md")
  #  Setup (org/bucket/token) robi się automatycznie przez DOCKER_INFLUXDB_INIT_*
  # ===========================================================================

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=168h
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - monitoring

  telegraf:
    image: telegraf:1.34
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      # Dane do inputs.elasticsearch
      - TRAINING_USER=${TRAINING_USER}
      - TRAINING_PASSWORD=${TRAINING_PASSWORD}
      # Telegraf czyta metryki hosta spod /hostfs
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_MOUNT_PREFIX=/hostfs
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro,z
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    ports:
      - "9273:9273"   # outputs.prometheus_client — Prometheus scrape'uje Telegrafa
    networks:
      - monitoring

  # ===========================================================================
  #  ZABBIX 7.0 LTS  (odpowiednik "Instalacja Zabbix.md")
  #  MariaDB + Server + Frontend (nginx) + Agent
  # ===========================================================================

  zabbix-db:
    image: mariadb:11.4
    container_name: zabbix-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --skip-character-set-client-handshake
      - --log-bin-trust-function-creators=1
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=zabbix
      - MARIADB_USER=zabbix
      - MARIADB_PASSWORD=${DB_ZABBIX_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - monitoring

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      - zabbix-db
    environment:
      - DB_SERVER_HOST=zabbix-db
      - DB_SERVER_PORT=3306
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${DB_ZABBIX_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - ZBX_STARTPOLLERS=5
      - ZBX_CACHESIZE=64M
    volumes:
      - zabbix-server-data:/var/lib/zabbix
    ports:
      - "10051:10051"
    networks:
      - monitoring

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-db
      - zabbix-server
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=zabbix-db
      - DB_SERVER_PORT=3306
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=${DB_ZABBIX_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - PHP_TZ=Europe/Warsaw
    ports:
      - "8081:8080"
    networks:
      - monitoring

  zabbix-agent:
    image: zabbix/zabbix-agent:ubuntu-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      - ZBX_HOSTNAME=Zabbix server
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_ACTIVE=zabbix-server
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
    ports:
      - "10050:10050"
    networks:
      - monitoring

  # ===========================================================================
  #  STACK-INIT — domyka integracje, których nie da się wstrzyknąć plikiem
  #
  #  1. Zabbix API: host "Zabbix server" dostaje interfejs agenta na kontener
  #     zabbix-agent (domyślnie wskazuje 127.0.0.1, gdzie agenta nie ma)
  #  2. Grafana API: włącza plugin Zabbixa i zakłada datasource Zabbix
  #
  #  Kontener jednorazowy i idempotentny — można go uruchamiać ponownie:
  #     docker compose up -d --force-recreate stack-init
  # ===========================================================================

  stack-init:
    image: alpine:3.21
    container_name: stack-init
    restart: "no"
    depends_on:
      - zabbix-web
      - grafana
    environment:
      - ZBX_URL=http://zabbix-web:8080/api_jsonrpc.php
      - ZBX_USER=Admin
      - ZBX_PASSWORD=zabbix
      - ZBX_AGENT_DNS=zabbix-agent
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./config/init:/init:ro,z
    entrypoint:
      - sh
      - -c
      - "apk add --no-cache --quiet curl jq && exec sh /init/stack-init.sh"
    networks:
      - monitoring
